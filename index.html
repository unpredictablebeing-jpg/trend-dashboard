  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.65);
      --card-border: rgba(34, 47, 75, 0.6);
      --card-hover-border: rgba(139, 124, 246, 0.6);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #6b7280;
      --accent: #8b7cf6;
      --accent-glow: rgba(139, 124, 246, 0.25);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-title: 'Outfit', 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.5;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* --- Header Section --- */
    header {
      margin-bottom: 24px;
      text-align: center;
      position: relative;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 28px;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .header-logo .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
      display: inline-block;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .date-badge {
      background: rgba(34, 47, 75, 0.4);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      font-size: 12px;
    }

    /* --- Main Tabs Section --- */
    .tabs-container {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none; /* Hide scrollbar for Firefox */
    }

    .tabs-container::-webkit-scrollbar {
      display: none; /* Hide scrollbar for Chrome/Safari */
    }

    .main-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .main-tab-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.03);
    }

    .main-tab-btn.active {
      color: var(--accent);
      background: rgba(139, 124, 246, 0.1);
      box-shadow: inset 0 0 0 1px rgba(139, 124, 246, 0.2);
    }

    /* --- Controls Section --- */
    .controls {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      backdrop-filter: blur(12px);
      margin-bottom: 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-row {
      position: relative;
      display: flex;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: rgba(11, 15, 25, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 11px 16px 11px 42px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(34, 47, 75, 0.4);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      background: rgba(34, 47, 75, 0.8);
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
      font-weight: 600;
    }

    /* --- Breakdown Sections --- */
    .category-section {
      margin-bottom: 44px;
    }

    .category-section-title {
      font-family: var(--font-title);
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .category-section-title span.count {
      font-size: 12px;
      color: var(--accent-text);
      background: rgba(139, 124, 246, 0.15);
      border: 1px solid rgba(139, 124, 246, 0.2);
      padding: 1px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* --- Grid Section --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* --- Card Component --- */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--card-hover-border);
      box-shadow: 0 12px 24px -10px var(--accent-glow);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }

    .source-badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .extra-badge {
      font-size: 11px;
      background: rgba(34, 47, 75, 0.5);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .card-title {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .card-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
      word-break: break-all;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      gap: 8px;
    }

    .publisher-label {
      font-size: 11px;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
    }

    .target-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .target-badge {
      font-size: 10px;
      font-weight: 500;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .source-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(139, 124, 246, 0.1);
      border: 1px solid rgba(139, 124, 246, 0.2);
      color: #c4b8ff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .source-link-btn:hover {
      background: var(--accent);
      color: #0b0f19;
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    /* --- Status Board / Empty State --- */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      width: 100%;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 11px;
      color: var(--text-dark);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 20px;
    }

    /* --- Responsive design --- */
    @media (max-width: 768px) {
      body {
        padding: 16px 8px;
      }
      .controls {
        padding: 12px;
      }
      .filter-buttons {
        gap: 6px;
      }
      .filter-btn {
        font-size: 12px;
        padding: 5px 12px;
      }
      .grid {
        grid-template-columns: 1fr;
      }
      .header-logo {
        font-size: 24px;
      }
    }
  </style>
</head>

    // Render Cards Grouped by Category (Breakdown Style)
    function renderDashboard() {
      dashboardSections.innerHTML = '';
      const allowedCategories = tabConfig[activeTab];
      
      // 1. Filter items globally
      const filtered = items.filter(item => {
        // Filter by current Tab's categories
        if (!allowedCategories.includes(item.category)) return false;
        
        // Filter by Sub-category pill
        if (activeCategory !== 'all' && item.category !== activeCategory) return false;
        
        // Filter by target audience
        if (activeTarget !== 'all') {
          if (!item.targets || !item.targets.includes(activeTarget)) return false;
        }
        
        // Filter by search query
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const titleMatch = item.title && item.title.toLowerCase().includes(q);
          const descMatch = item.desc && item.desc.toLowerCase().includes(q);
          const pubMatch = item.publisher && item.publisher.toLowerCase().includes(q);
          if (!titleMatch && !descMatch && !pubMatch) return false;
        }
        
        return true;
      });

      if (filtered.length === 0) {
        dashboardSections.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>該当するトピックが見つかりません</h3>
            <p>検索ワードやフィルター条件を変更してください。</p>
          </div>
        `;
        return;
      }

      // 2. Render sections based on active category selection
      const categoriesToRender = activeCategory === 'all' 
        ? allowedCategories 
        : [activeCategory];

      categoriesToRender.forEach(cat => {
        const catItems = filtered.filter(item => item.category === cat);
        if (catItems.length === 0) return; // Skip empty categories

        const meta = categoryMeta[cat] || { label: 'その他', bg: 'rgba(255,255,255,0.05)', color: '#fff', icon: '📝' };

        // Create Section
        const section = document.createElement('div');
        section.className = 'category-section';

        // Section Title
        section.innerHTML = `
          <div class="category-section-title">
            ${meta.icon} ${meta.label} <span class="count">${catItems.length}</span>
          </div>
        `;

        // Card Grid
        const grid = document.createElement('div');
        grid.className = 'grid';

        // Add Cards
        catItems.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';

          const targetHTML = item.targets && item.targets.length > 0
            ? item.targets.map(t => `<span class="target-badge">${t}</span>`).join('')
            : '';

          const pubLabel = item.publisher 
            ? `🌐 ${item.publisher}` 
            : (item.extra && !item.extra.includes('検索数:') ? item.extra : '');

          const linkHTML = item.url
            ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="source-link-btn">ソースを開く ↗</a>`
            : '';

          card.innerHTML = `
            <div class="card-header">
              <span class="source-badge" style="background: ${meta.bg}; color: ${meta.color};">
                ${meta.icon} ${meta.label}
              </span>
              ${item.extra && item.extra.includes('検索数:') ? `<span class="extra-badge">${item.extra}</span>` : ''}
            </div>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-desc">${item.desc || '（詳細要約はありません）'}</p>
            <div class="card-footer">
              <span class="publisher-label" title="${pubLabel}">${pubLabel}</span>
              <div class="target-badges" style="margin-right: 8px;">
                ${targetHTML}
              </div>
              ${linkHTML}
            </div>
          `;
          grid.appendChild(card);
        });

        section.appendChild(grid);
        dashboardSections.appendChild(section);
      });
    }

    // Event Listeners for Main Tabs
    mainTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.main-tab-btn');
      if (!btn || btn.classList.contains('active')) return;
      
      mainTabs.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      
      updateCategoryFilters();
      renderDashboard();
    });

    // Event Listeners for Sub-category filters
    categoryFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      
      categoryFilters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.category;
      renderDashboard();
    });

    // Event Listeners for Target filters
    targetFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      
      targetFilters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTarget = btn.dataset.target;
      renderDashboard();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderDashboard();
    });

    // Initial load
    updateCategoryFilters();
    renderDashboard();
  </script>
</body>
</html>
