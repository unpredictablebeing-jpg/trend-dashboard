<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trend Intelligence Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       THEME CONFIGURATION: DUAL THEME (LIGHT DEFAULT / DARK)
       Solves monochromatic / blending contrast issues completely
       ========================================================= */
    :root {
      /* --- LIGHT THEME (Default: Clean, Crisp, High Contrast) --- */
      --bg-color: #f1f5f9;
      --surface-controls: #ffffff;
      --surface-controls-border: #cbd5e1;
      
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      
      --filter-btn-bg: #ffffff;
      --filter-btn-border: #cbd5e1;
      --filter-btn-color: #334155;
      --filter-btn-hover-bg: #f1f5f9;
      
      --date-badge-bg: #e2e8f0;
      --date-badge-border: #cbd5e1;
      --date-badge-color: #1e293b;
      
      /* Pure Solid White Record on Light Slate Background */
      --record-bg: #ffffff;
      --record-bg-hover: #fbfcfe;
      --record-border: #cbd5e1;
      --record-border-hover: #4f46e5;
      --record-shadow: 0 3px 12px rgba(15, 23, 42, 0.07), 0 1px 3px rgba(15, 23, 42, 0.05);
      --record-shadow-hover: 0 8px 24px rgba(79, 70, 229, 0.15), 0 0 0 1.5px #4f46e5;
      
      /* High Legibility Typography */
      --text-title: #0f172a;
      --text-title-hover: #4f46e5;
      --text-body: #1e293b;
      --text-muted: #64748b;
      --text-sub: #64748b;
      
      /* Summary Box */
      --summary-bg: #f8fafc;
      --summary-border: #e2e8f0;
      --summary-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.04);
      
      /* Badges & Actions */
      --orig-label-bg: #e2e8f0;
      --orig-label-border: #cbd5e1;
      --orig-label-color: #475569;
      
      --target-badge-bg: #e0f2fe;
      --target-badge-border: #bae6fd;
      --target-badge-color: #0369a1;
      
      --source-btn-bg: #4f46e5;
      --source-btn-hover-bg: #4338ca;
      --source-btn-color: #ffffff;
      
      --tab-btn-color: #475569;
      --tab-btn-hover: #0f172a;
      --tab-border: #cbd5e1;
      --footer-border: #cbd5e1;
      --empty-state-bg: #ffffff;
      --empty-state-border: #cbd5e1;
      
      --accent: #4f46e5;
      --accent-light: #6366f1;
      --accent-glow: rgba(79, 70, 229, 0.25);
      
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-title: 'Outfit', 'Inter', sans-serif;
    }

    [data-theme="dark"] {
      /* --- DARK THEME (Pure Black x Charcoal: Completely eliminates blue-on-blue blending) --- */
      --bg-color: #09090b;
      --surface-controls: #141417;
      --surface-controls-border: #27272a;
      
      --input-bg: #1c1c20;
      --input-border: #27272a;
      
      --filter-btn-bg: #18181b;
      --filter-btn-border: #3f3f46;
      --filter-btn-color: #e4e4e7;
      --filter-btn-hover-bg: #27272a;
      
      --date-badge-bg: #18181b;
      --date-badge-border: #3f3f46;
      --date-badge-color: #f4f4f5;
      
      /* Non-monochromatic Charcoal Card on Pitch Black */
      --record-bg: #18181b;
      --record-bg-hover: #222226;
      --record-border: #3f3f46;
      --record-border-hover: #818cf8;
      --record-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      --record-shadow-hover: 0 10px 28px rgba(0, 0, 0, 0.8), 0 0 0 1.5px #818cf8;
      
      --text-title: #ffffff;
      --text-title-hover: #a5b4fc;
      --text-body: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-sub: #a1a1aa;
      
      --summary-bg: #101013;
      --summary-border: #27272a;
      --summary-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
      
      --orig-label-bg: #27272a;
      --orig-label-border: #3f3f46;
      --orig-label-color: #d4d4d8;
      
      --target-badge-bg: #1e293b;
      --target-badge-border: #334155;
      --target-badge-color: #93c5fd;
      
      --source-btn-bg: #4f46e5;
      --source-btn-hover-bg: #4338ca;
      --source-btn-color: #ffffff;
      
      --tab-btn-color: #a1a1aa;
      --tab-btn-hover: #ffffff;
      --tab-border: #27272a;
      --footer-border: #27272a;
      --empty-state-bg: #141416;
      --empty-state-border: #27272a;
      
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-glow: rgba(99, 102, 241, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-body);
      font-family: var(--font-sans);
      min-height: 100vh;
      padding: 24px 16px 60px;
      line-height: 1.6;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    /* --- Header Section --- */
    header {
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .header-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-title);
      font-weight: 800;
      font-size: 28px;
      background: linear-gradient(135deg, #a855f7 0%, #4f46e5 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .header-logo .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      display: inline-block;
    }

    .theme-toggle-btn {
      background: var(--surface-controls);
      border: 1px solid var(--surface-controls-border);
      color: var(--text-body);
      padding: 7px 15px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .theme-toggle-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-1px);
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 13.5px;
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .date-badge {
      background: var(--date-badge-bg);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--date-badge-border);
      font-size: 12px;
      color: var(--date-badge-color);
      font-weight: 600;
    }

    /* --- Main Tabs --- */
    .tabs-container {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      border-bottom: 1.5px solid var(--tab-border);
      padding-bottom: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tabs-container::-webkit-scrollbar {
      display: none;
    }

    .main-tab-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--tab-btn-color);
      font-family: var(--font-title);
      font-size: 15px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .main-tab-btn:hover {
      color: var(--tab-btn-hover);
      background: rgba(0, 0, 0, 0.04);
    }

    [data-theme="dark"] .main-tab-btn:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .main-tab-btn.active {
      color: #ffffff;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 3px 12px var(--accent-glow);
    }

    /* --- Controls Panel --- */
    .controls {
      background: var(--surface-controls);
      border: 1px solid var(--surface-controls-border);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 26px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    [data-theme="dark"] .controls {
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .search-row {
      position: relative;
      display: flex;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 9px;
      padding: 11px 16px 11px 44px;
      color: var(--text-title);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-controls);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-label {
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 700;
    }

    .filter-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: var(--filter-btn-bg);
      border: 1px solid var(--filter-btn-border);
      color: var(--filter-btn-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      background: var(--filter-btn-hover-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    /* --- Results Header Bar --- */
    .results-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    .results-count {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .results-count strong {
      color: var(--text-title);
      font-weight: 700;
    }

    /* --- Category Section --- */
    .category-section {
      margin-bottom: 36px;
    }

    .category-section-title {
      font-family: var(--font-title);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--tab-border);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-title);
    }

    .category-section-title span.count {
      font-size: 11.5px;
      color: var(--accent);
      background: var(--summary-bg);
      border: 1px solid var(--summary-border);
      padding: 1px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* --- RECORD LIST (Proposal A: Horizontal Stripe Format) --- */
    .record-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .record-row {
      background: var(--record-bg);
      border: 1.5px solid var(--record-border);
      border-radius: 12px;
      padding: 18px 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: flex-start;
      position: relative;
      overflow: hidden;
      box-shadow: var(--record-shadow);
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .record-row:hover {
      background: var(--record-bg-hover);
      border-color: var(--record-border-hover);
      transform: translateY(-2px);
      box-shadow: var(--record-shadow-hover);
    }

    /* Left Accent Stripe */
    .record-row::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 7px;
      background: var(--cat-accent, var(--accent));
      box-shadow: 0 0 10px var(--cat-accent, var(--accent));
      border-top-left-radius: 12px;
      border-bottom-left-radius: 12px;
    }

    .record-content {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
      padding-left: 2px;
    }

    /* Upper Meta Row */
    .record-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cat-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid currentColor;
    }

    .extra-tag {
      font-size: 11.5px;
      font-weight: 700;
      color: #0284c7;
      background: #e0f2fe;
      border: 1px solid #bae6fd;
      padding: 2px 8px;
      border-radius: 6px;
    }

    [data-theme="dark"] .extra-tag {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.16);
      border-color: rgba(56, 189, 248, 0.35);
    }

    .publisher-tag {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Main Title */
    .record-title {
      font-size: 17.5px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--text-title);
      word-break: break-word;
      letter-spacing: -0.01em;
    }

    .record-title a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .record-title a:hover {
      color: var(--text-title-hover);
      text-decoration: underline;
    }

    /* Original Title (for English items) */
    .record-original-title {
      font-size: 12.5px;
      color: var(--text-sub);
      line-height: 1.4;
      display: flex;
      align-items: baseline;
      gap: 6px;
      word-break: break-all;
    }

    .record-original-title .orig-label {
      background: var(--orig-label-bg);
      border: 1px solid var(--orig-label-border);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      color: var(--orig-label-color);
      flex-shrink: 0;
    }

    /* Summary Description */
    .record-summary {
      font-size: 14px;
      color: var(--text-body);
      line-height: 1.7;
      word-break: break-word;
      background: var(--summary-bg);
      border: 1px solid var(--summary-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 4px;
      box-shadow: var(--summary-shadow);
    }

    /* Right Action Area */
    .record-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
      padding-top: 2px;
    }

    .target-badges {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .target-badge {
      font-size: 11px;
      font-weight: 600;
      background: var(--target-badge-bg);
      color: var(--target-badge-color);
      border: 1px solid var(--target-badge-border);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .source-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--source-btn-bg);
      border: 1px solid transparent;
      color: var(--source-btn-color);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      text-decoration: none;
      font-weight: 700;
      transition: all 0.15s ease;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.3);
    }

    .source-btn:hover {
      background: var(--source-btn-hover-bg);
      box-shadow: 0 4px 16px var(--accent-glow);
      transform: translateY(-1px);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--empty-state-bg);
      border: 1px dashed var(--empty-state-border);
      border-radius: 14px;
    }

    .empty-state-icon {
      font-size: 44px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 17px;
      color: var(--text-title);
      margin-bottom: 6px;
    }

    footer {
      margin-top: 60px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1.5px solid var(--footer-border);
      padding-top: 24px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      body {
        padding: 16px 8px 40px;
      }
      .header-top {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .record-row {
        grid-template-columns: 1fr;
        padding: 14px 16px;
        gap: 12px;
      }
      .record-actions {
        flex-direction: row;
        align-items: center;
        width: 100%;
        border-top: 1px solid var(--surface-controls-border);
        padding-top: 10px;
      }
      .header-logo {
        font-size: 24px;
      }
    }
  </style>
</head>

    // Tab categories configuration
    const tabConfig = {
      trends: ['google_trends', 'hacker_news', 'hatena_hot', 'hatena_new'],
      research: ['active_research', 'adjacent_research'],
      announcements: ['new_products', 'events', 'projects', 'laws']
    };

    let activeTab = 'trends';
    let activeCategory = 'all';
    let activeTarget = 'all';
    let searchQuery = '';

    const mainTabs = document.getElementById('mainTabs');
    const dashboardSections = document.getElementById('dashboardSections');
    const searchInput = document.getElementById('searchInput');
    const categoryFilters = document.getElementById('categoryFilters');
    const targetFilters = document.getElementById('targetFilters');
    const resultsCount = document.getElementById('resultsCount');

    // Theme Switcher Logic
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = themeToggleBtn.querySelector('.theme-icon');
    const themeLabel = themeToggleBtn.querySelector('.theme-label');

    function applyTheme(theme) {
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'ライト';
      } else {
        document.documentElement.removeAttribute('data-theme');
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'ダーク';
      }
      localStorage.setItem('trend_portal_theme', theme);
    }

    // Default to Light theme to solve monochromatic issues
    const currentSavedTheme = localStorage.getItem('trend_portal_theme') || 'light';
    applyTheme(currentSavedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'light' : 'dark');
    });

    // Create Category Filter Buttons dynamically based on active tab
    function updateCategoryFilters() {
      categoryFilters.innerHTML = '<button class="filter-btn active" data-category="all">すべて</button>';
      
      const allowedCategories = tabConfig[activeTab];
      const categoriesPresent = [...new Set(items.map(item => item.category))].filter(cat => allowedCategories.includes(cat));
      
      categoriesPresent.forEach(cat => {
        const meta = categoryMeta[cat];
        if (meta) {
          const btn = document.createElement('button');
          btn.className = 'filter-btn';
          btn.dataset.category = cat;
          btn.innerHTML = `${meta.icon} ${meta.label}`;
          categoryFilters.appendChild(btn);
        }
      });
      
      activeCategory = 'all';
    }

    // Render Records in List Layout (Proposal A)
    function renderDashboard() {
      dashboardSections.innerHTML = '';
      const allowedCategories = tabConfig[activeTab];
      
      // 1. Filter items
      const filtered = items.filter(item => {
        if (!allowedCategories.includes(item.category)) return false;
        if (activeCategory !== 'all' && item.category !== activeCategory) return false;
        
        if (activeTarget !== 'all') {
          if (!item.targets || !item.targets.includes(activeTarget)) return false;
        }
        
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const titleJaMatch = item.title_ja && item.title_ja.toLowerCase().includes(q);
          const titleEnMatch = item.title_en && item.title_en.toLowerCase().includes(q);
          const titleMatch = item.title && item.title.toLowerCase().includes(q);
          const descMatch = item.desc && item.desc.toLowerCase().includes(q);
          const pubMatch = item.publisher && item.publisher.toLowerCase().includes(q);
          if (!titleJaMatch && !titleEnMatch && !titleMatch && !descMatch && !pubMatch) return false;
        }
        
        return true;
      });

      // Update Result Count
      resultsCount.innerHTML = `表示中: <strong>${filtered.length}</strong> 件`;

      if (filtered.length === 0) {
        dashboardSections.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h3>該当するニュース・情報が見つかりません</h3>
            <p>検索キーワードや対象層、カテゴリフィルターの条件を変更してお試しください。</p>
          </div>
        `;
        return;
      }

      // 2. Render sections
      const categoriesToRender = activeCategory === 'all' 
        ? allowedCategories 
        : [activeCategory];

      categoriesToRender.forEach(cat => {
        const catItems = filtered.filter(item => item.category === cat);
        if (catItems.length === 0) return;

        const meta = categoryMeta[cat] || { label: 'その他', bg: 'rgba(99, 102, 241, 0.1)', color: '#4f46e5', icon: '📝' };

        const section = document.createElement('div');
        section.className = 'category-section';

        section.innerHTML = `
          <div class="category-section-title">
            ${meta.icon} ${meta.label} <span class="count">${catItems.length}件</span>
          </div>
        `;

        const recordList = document.createElement('div');
        recordList.className = 'record-list';

        catItems.forEach(item => {
          const row = document.createElement('div');
          row.className = 'record-row';
          row.style.setProperty('--cat-accent', meta.color);

          // Target audience badges
          const targetHTML = item.targets && item.targets.length > 0
            ? item.targets.map(t => `<span class="target-badge">${t}</span>`).join('')
            : '';

          // Publisher & Extra
          const pubLabel = item.publisher ? item.publisher : '';
          const hasTraffic = item.extra && item.extra.includes('検索数:');

          // Title & Original Title
          const displayTitle = item.title_ja || item.title;
          const origTitle = item.title_en;

          // Source button
          const linkHTML = item.url
            ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer" class="source-btn">記事を開く ↗</a>`
            : '';

          row.innerHTML = `
            <div class="record-content">
              <div class="record-meta-row">
                <span class="cat-badge" style="color: ${meta.color};">
                  ${meta.icon} ${meta.label}
                </span>
                ${hasTraffic ? `<span class="extra-tag">${item.extra}</span>` : ''}
                ${pubLabel ? `<span class="publisher-tag">🌐 ${pubLabel}</span>` : ''}
              </div>

              <h3 class="record-title">
                ${item.url 
                  ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">${displayTitle}</a>` 
                  : displayTitle}
              </h3>

              ${origTitle ? `
                <div class="record-original-title">
                  <span class="orig-label">原文</span>
                  <span>${origTitle}</span>
                </div>
              ` : ''}

              <div class="record-summary">
                ${item.desc || '（詳細要約はありません）'}
              </div>
            </div>

            <div class="record-actions">
              <div class="target-badges">
                ${targetHTML}
              </div>
              ${linkHTML}
            </div>
          `;

          recordList.appendChild(row);
        });

        section.appendChild(recordList);
        dashboardSections.appendChild(section);
      });
    }

    // Event Listeners for Main Tabs
    mainTabs.addEventListener('click', (e) => {
      const btn = e.target.closest('.main-tab-btn');
      if (!btn || btn.classList.contains('active')) return;
      
      mainTabs.querySelectorAll('.main-tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.dataset.tab;
      
      updateCategoryFilters();
      renderDashboard();
    });

    // Event Listeners for Sub-category filters
    categoryFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      
      categoryFilters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.category;
      renderDashboard();
    });

    // Event Listeners for Target filters
    targetFilters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      
      targetFilters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTarget = btn.dataset.target;
      renderDashboard();
    });

    // Event Listener for Search Input
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderDashboard();
    });

    // Initial load
    updateCategoryFilters();
    renderDashboard();
  </script>
